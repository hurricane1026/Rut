name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: stacked PRs (base = another feature branch)
  # must run CI too. pull_request uses the HEAD branch's workflow file,
  # so this takes effect as soon as the branch carries this change.
  pull_request:
  schedule:
    - cron: '11 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Manual run mode'
        required: true
        default: ci
        type: choice
        options:
          - ci
          - docker-launch-diagnostic
          - integer-parser
      require_avx512:
        description: 'Require AVX-512 execution for the integer-parser diagnostic'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

jobs:
  plan:
    name: CI scope and policy checks
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.scope.outputs.native }}
      format: ${{ steps.scope.outputs.format }}
      models: ${{ steps.scope.outputs.models }}
      full: ${{ steps.scope.outputs.full }}
      matrix: ${{ steps.scope.outputs.matrix }}
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify CI selection and sharding controls
        run: |
          python3 -m unittest discover -s tests -p 'test_ci_*.py'
          bash -n scripts/check_parse_integer_arch.sh
      - name: Select validation scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            python3 scripts/plan_ci.py --base "$BASE_SHA" --output "$GITHUB_OUTPUT"
          else
            python3 scripts/plan_ci.py --output "$GITHUB_OUTPUT"
          fi

  format:
    name: clang-format
    needs: plan
    if: needs.plan.outputs.format == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'ci')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install clang-format (LLVM snapshot, v20)
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble main" | \
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-format-20 || sudo apt-get install -y clang-format-19
          CF=$(command -v clang-format-20 || command -v clang-format-19)
          echo "CF=$CF" >> "$GITHUB_ENV"
          $CF --version

      - name: Check formatting
        run: |
          find include src helpers testing tests bench -name '*.h' -o -name '*.cc' | \
            xargs $CF --dry-run --Werror

  lint:
    name: clang-tidy
    needs: plan
    if: needs.plan.outputs.format == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'ci')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install tools
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | \
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-22 clang-tidy-22 llvm-22-dev cmake ninja-build libboost-dev ragel
          clang-22 --version
          clang-tidy-22 --version

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22 -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm

      - name: Lint
        run: |
          # Exclude all arch-specific SIMD backends — only lint scalar
          # and main parser code (arch-independent).
          find src helpers -name '*.cc' \
            ! -name 'kqueue_backend.cc' \
            ! -path '*/simd/sse2.cc' \
            ! -path '*/simd/avx2.cc' \
            ! -path '*/simd/avx512.cc' \
            ! -path '*/simd/neon.cc' \
            ! -path '*/simd/sve.cc' | \
            xargs clang-tidy-22 -p build --warnings-as-errors='bugprone-*,performance-*'

  runtime-state-model:
    name: Runtime state model
    needs: plan
    if: needs.plan.outputs.models == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'ci')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download TLA+ tools
        run: |
          python3 -m unittest tests/test_tla2tools_acquisition.py
          python3 scripts/acquire_tla2tools.py /tmp/tla2tools.jar

      - name: Check runtime state model
        run: TLA2TOOLS_JAR=/tmp/tla2tools.jar python3 scripts/check_runtime_state_model.py

      - name: Check wait scheduler safety, liveness and counterexamples
        run: |
          python3 scripts/check_wait_scheduler_model.py --jar /tmp/tla2tools.jar \
            --output-dir /tmp/wait-scheduler-tlc

      - name: Preserve wait scheduler model traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wait-scheduler-tlc
          path: /tmp/wait-scheduler-tlc
          if-no-files-found: ignore

      - name: Check upstream retirement safety and required counterexamples
        run: |
          python3 scripts/check_upstream_retirement_model.py --jar /tmp/tla2tools.jar \
            --output-dir /tmp/upstream-retirement-tlc

      - name: Preserve upstream retirement model traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-retirement-tlc
          path: /tmp/upstream-retirement-tlc
          if-no-files-found: ignore

      - name: Check timer safety, progress and required counterexamples
        run: |
          python3 scripts/check_timer_model.py --jar /tmp/tla2tools.jar \
            --output-dir /tmp/timer-tlc

      - name: Preserve timer model traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timer-tlc
          path: /tmp/timer-tlc
          if-no-files-found: ignore

      - name: Check synchronization design and required counterexamples
        run: python3 scripts/check_synchronization_model.py --jar /tmp/tla2tools.jar

      - name: Cross-check native concurrency verifier with TLC
        run: |
          c++ -std=c++23 -O1 -fno-exceptions -fno-rtti -Iinclude -Itesting \
            tests/test_concurrency_verifier.cc src/compiler/concurrency_verifier.cc \
            src/compiler/wait_verifier.cc src/placement_new.cc \
            -o /tmp/rut-concurrency-reference
          /tmp/rut-concurrency-reference
          python3 scripts/check_concurrency_model.py \
            --checker /tmp/rut-concurrency-reference --jar /tmp/tla2tools.jar \
            --output-dir /tmp/concurrency-reference-tlc

      - name: Preserve native concurrency reference models and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concurrency-reference-tlc
          path: /tmp/concurrency-reference-tlc
          if-no-files-found: ignore

  test:
    name: Build & Test (${{ matrix.compiler }}, ${{ matrix.build_type }}, shard ${{ matrix.shard }}/4)
    needs: plan
    if: needs.plan.outputs.native == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'ci')
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1G
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Verify CI test sharding
        run: python3 -m unittest discover -s tests -p test_ci_sharding.py
      # Cache compiler outputs, never test results. ccache revalidates compiler
      # contents, flags and included files before reusing an object.
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.compiler }}-${{ matrix.build_type }}-
      - name: Install tools
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | \
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build llvm-21-dev libboost-dev ragel ccache
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang-21
            sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-21 100
            sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-21 100
          fi

      - name: Verify cached compiler source paths
        env:
          CI_COMPILER: ${{ matrix.compiler == 'clang' && 'clang-21' || 'gcc' }}
        run: python3 scripts/check_ci_source_paths.py --compiler "$CI_COMPILER" --launcher ccache

      - name: Configure
        run: |
          ccache --zero-stats
          LLVM_OPT="-DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            CC=clang CXX=clang++ cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} $LLVM_OPT
          else
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} $LLVM_OPT
          fi

      - name: Build
        run: |
          ninja -C build
          ccache --show-stats

      # Publish immediately after building so long-running tests do not delay
      # cache availability. Identical shards share one immutable cache key.
      - name: Save compiler cache
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Set up Java for compiler-generated protocol models
        if: matrix.compiler == 'clang' && matrix.build_type == 'Debug' && matrix.shard == 1 && needs.plan.outputs.models == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cross-check compiler-generated handler models with TLC
        if: matrix.compiler == 'clang' && matrix.build_type == 'Debug' && matrix.shard == 1 && needs.plan.outputs.models == 'true'
        run: |
          python3 scripts/acquire_tla2tools.py /tmp/handler-tla2tools.jar
          python3 scripts/check_handler_models.py --checker build/tests/test_handler_reference \
            --jar /tmp/handler-tla2tools.jar --output-dir /tmp/handler-reference-tlc

      - name: Preserve compiler-generated models and counterexamples
        if: always() && matrix.compiler == 'clang' && matrix.build_type == 'Debug' && matrix.shard == 1 && needs.plan.outputs.models == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: handler-reference-tlc
          path: /tmp/handler-reference-tlc
          if-no-files-found: ignore

      - name: Reject wait scheduler implementation mutations
        if: matrix.compiler == 'clang' && matrix.build_type == 'Debug' && matrix.shard == 1 && needs.plan.outputs.models == 'true'
        run: |
          python3 scripts/check_wait_scheduler_mutations.py --build-dir build \
            --output-dir /tmp/wait-scheduler-mutations

      - name: Preserve wait scheduler implementation counterexamples
        if: always() && matrix.compiler == 'clang' && matrix.build_type == 'Debug' && matrix.shard == 1 && needs.plan.outputs.models == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wait-scheduler-cpp-mutations
          path: /tmp/wait-scheduler-mutations
          if-no-files-found: ignore

      - name: Reject upstream retirement implementation mutations
        if: matrix.compiler == 'clang' && matrix.build_type == 'Debug' && matrix.shard == 1 && needs.plan.outputs.models == 'true'
        run: |
          python3 scripts/check_upstream_retirement_mutations.py --build-dir build \
            --output-dir /tmp/upstream-retirement-mutations

      - name: Preserve upstream retirement implementation counterexamples
        if: always() && matrix.compiler == 'clang' && matrix.build_type == 'Debug' && matrix.shard == 1 && needs.plan.outputs.models == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-retirement-cpp-mutations
          path: /tmp/upstream-retirement-mutations
          if-no-files-found: ignore

      - name: Reject timer implementation mutations
        if: matrix.compiler == 'clang' && matrix.build_type == 'Debug' && matrix.shard == 1 && needs.plan.outputs.models == 'true'
        run: |
          python3 scripts/check_timer_mutations.py --build-dir build \
            --output-dir /tmp/timer-mutations

      - name: Preserve timer implementation counterexamples
        if: always() && matrix.compiler == 'clang' && matrix.build_type == 'Debug' && matrix.shard == 1 && needs.plan.outputs.models == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: timer-cpp-mutations
          path: /tmp/timer-mutations
          if-no-files-found: ignore

      - name: Test
        env:
          CI_FULL: ${{ needs.plan.outputs.full }}
          CI_CHANGED_FILES: ${{ needs.plan.outputs.changed }}
          CI_SHARD: ${{ matrix.shard }}
        run: |
          selection=()
          if [[ "$CI_FULL" != true ]]; then
            selection=(--pr --changed-files-json "$CI_CHANGED_FILES")
          fi
          python3 scripts/run_ci_shard.py --build-dir build --shard "$CI_SHARD" --shards 4 "${selection[@]}"

      - name: Preserve test results and shard inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ matrix.shard }}
          path: |
            build/ci-shard-inventory.json
            build/ci-shard-results.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  nginx-required:
    name: Required pinned nginx differentials
    needs: plan
    if: needs.plan.outputs.full == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install tools
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | \
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build llvm-21-dev libboost-dev ragel

      - name: Provision exact pinned nginx image
        run: |
          set -euo pipefail
          mapfile -t pinned_images < tests/pinned-nginx-image.txt
          if (( ${#pinned_images[@]} != 1 )); then
            echo "tests/pinned-nginx-image.txt must contain exactly one image reference" >&2
            exit 1
          fi
          image=${pinned_images[0]}
          if [[ ! "$image" =~ ^nginx@sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid pinned nginx image reference" >&2
            exit 1
          fi

          for attempt in 1 2 3; do
            if docker pull "$image"; then
              break
            fi
            if (( attempt == 3 )); then
              echo "failed to pull the pinned nginx image after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

          docker image inspect "$image" > /dev/null
          if ! docker image inspect \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image" | \
              grep -Fqx -- "$image"; then
            echo "pulled image does not expose the exact required RepoDigest" >&2
            exit 1
          fi

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRUT_ENABLE_JIT=ON \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm

      - name: Build nginx differential targets
        run: ninja -C build test_nginx_parser test_nginx_convert test_nginx_differential

      - name: Test required nginx differentials
        run: |
          RUT_NGINX_DIFFERENTIAL_REQUIRED=1 \
          ctest --test-dir build --output-on-failure --no-tests=error -j 1 --timeout 120 -L nginx

  envoy-required:
    name: Required pinned Envoy differentials
    needs: plan
    if: needs.plan.outputs.full == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install tools
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | \
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build llvm-21-dev libboost-dev ragel

      - name: Provision exact pinned Envoy image
        run: |
          set -euo pipefail
          mapfile -t pinned_images < tests/pinned-envoy-image.txt
          if (( ${#pinned_images[@]} != 1 )); then
            echo "tests/pinned-envoy-image.txt must contain exactly one image reference" >&2
            exit 1
          fi
          image=${pinned_images[0]}
          if [[ ! "$image" =~ ^envoyproxy/envoy@sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid pinned Envoy image reference" >&2
            exit 1
          fi

          for attempt in 1 2 3; do
            if docker pull "$image"; then
              break
            fi
            if (( attempt == 3 )); then
              echo "failed to pull the pinned Envoy image after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

          docker image inspect "$image" > /dev/null
          if ! docker image inspect \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image" | \
              grep -Fqx -- "$image"; then
            echo "pulled image does not expose the exact required RepoDigest" >&2
            exit 1
          fi

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRUT_ENABLE_JIT=ON \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm

      - name: Build standalone Envoy helper
        run: |
          cmake -S helpers/envoy -B build-envoy-helper -G Ninja
          cmake --build build-envoy-helper

      - name: Build Envoy differential targets
        run: ninja -C build rut rut-envoy-convert test_envoy_parser test_envoy_convert test_envoy_differential

      - name: Test required Envoy differentials
        run: |
          RUT_ENVOY_DIFFERENTIAL_REQUIRED=1 \
          ctest --test-dir build --output-on-failure --no-tests=error -j 1 --timeout 120 -L envoy

      - name: Upload Envoy oracle transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: envoy-oracle-transcript
          path: build/envoy_oracle_milestone_s.inc

      - name: Upload Envoy-vs-RUT pair transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: envoy-pair-transcript
          path: build/envoy_pair_milestone_s.inc

  docker-launch-diagnostic:
    name: Docker launch diagnostic — not acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'docker-launch-diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install tools
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | \
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build llvm-21-dev libboost-dev ragel

      - name: Provision exact pinned nginx image
        run: |
          set -euo pipefail
          mapfile -t pinned_images < tests/pinned-nginx-image.txt
          if (( ${#pinned_images[@]} != 1 )); then
            echo "tests/pinned-nginx-image.txt must contain exactly one image reference" >&2
            exit 1
          fi
          image=${pinned_images[0]}
          if [[ ! "$image" =~ ^nginx@sha256:[0-9a-f]{64}$ ]]; then
            echo "invalid pinned nginx image reference" >&2
            exit 1
          fi
          for attempt in 1 2 3; do
            if docker pull "$image"; then
              break
            fi
            if (( attempt == 3 )); then
              echo "failed to pull the pinned nginx image after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
          docker image inspect "$image" > /dev/null
          docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image" | \
            grep -Fqx -- "$image"

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRUT_ENABLE_JIT=ON \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm

      - name: Build nginx differential target
        run: ninja -C build test_nginx_parser test_nginx_convert test_nginx_differential

      - name: Run Docker launch diagnostic (not acceptance)
        run: |
          set -o pipefail
          set +e
          {
            echo "git rev-parse HEAD: $(git rev-parse HEAD)"
            echo "requested ref: ${{ github.ref }}"
            ./build/tests/test_nginx_differential --docker-info-launch-diagnostic
          } 2>&1 | tee docker-launch-diagnostic.log
          pipeline_status=("${PIPESTATUS[@]}")
          diagnostic_status=${pipeline_status[0]}
          tee_status=${pipeline_status[1]}
          report_status=0
          echo "diagnostic exit status: ${diagnostic_status}" | tee -a docker-launch-diagnostic.log || report_status=$?
          if (( tee_status != 0 || report_status != 0 )); then
            echo "diagnostic evidence log write failed" >&2
            exit 1
          fi
          exit "${diagnostic_status}"

      - name: Upload Docker launch diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-launch-diagnostic
          path: docker-launch-diagnostic.log
          if-no-files-found: warn
          retention-days: 7

  test-no-jit:
    name: Build & Test (no JIT)
    needs: plan
    if: needs.plan.outputs.full == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'ci')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-dev

      - name: Configure
        run: cmake -B build -G Ninja -DRUT_ENABLE_JIT=OFF -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: ninja -C build

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error -j 1 --timeout 120

  test-no-websocket:
    name: Build & Test (no WebSocket)
    needs: plan
    if: needs.plan.outputs.full == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'ci')
    runs-on: ubuntu-24.04
    # RUT_ENABLE_WEBSOCKET=0 is a shipped config (minimal mesh sidecars that never
    # proxy WebSocket). Build it so the #if RUT_ENABLE_WEBSOCKET runtime paths compile
    # out cleanly AND the parser rejects websocket() routes
    # (websocket_rejected_when_tunnel_disabled). JIT off — the gate test is frontend-only.
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-dev
      - name: Configure
        run: cmake -B build -G Ninja -DRUT_ENABLE_WEBSOCKET=OFF -DRUT_ENABLE_JIT=OFF -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: ninja -C build
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error -j 1 --timeout 120

  sanitizer:
    name: Sanitizer (ASan+UBSan)
    needs: plan
    if: needs.plan.outputs.full == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'ci')
    runs-on: ubuntu-24.04
    # ubuntu-24.04 has a 6.x kernel, so the real-io_uring integration tests
    # (proxy-over-TLS keep-alive, watermark backpressure, recv re-arm) actually
    # run here under AddressSanitizer — the detector for the io_uring async-cancel /
    # recv lifecycle bugs that are otherwise only reasoned about. JIT is off (its
    # generated code isn't instrumented).
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-dev
      - name: Configure
        run: cmake -B build -G Ninja -DRUT_ENABLE_JIT=OFF -DRUT_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: ninja -C build
      - name: Test
        # halt_on_error=1: fail the job on the first ASan/UBSan report.
        # detect_leaks=0: the per-shard mmap arenas are intentionally never freed.
        run: |
          ASAN_OPTIONS=halt_on_error=1:detect_leaks=0 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
          ctest --test-dir build --output-on-failure --no-tests=error -j 1 --timeout 300

  coverage:
    name: Code Coverage
    needs: plan
    if: needs.plan.outputs.full == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'ci')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install tools
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | \
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-21 llvm-21 llvm-21-dev cmake ninja-build libboost-dev ragel
          echo "CC=/usr/bin/clang-21" >> "$GITHUB_ENV"
          echo "CXX=/usr/bin/clang++-21" >> "$GITHUB_ENV"
          echo "LLVM_PROFDATA=/usr/bin/llvm-profdata-21" >> "$GITHUB_ENV"
          echo "LLVM_COV=/usr/bin/llvm-cov-21" >> "$GITHUB_ENV"

      - name: Build with coverage
        run: |
          CC="$CC" CXX="$CXX" cmake -B build -G Ninja \
            -DCMAKE_CXX_FLAGS="-fprofile-instr-generate -fcoverage-mapping" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm
          ninja -C build

      - name: Run tests
        run: |
          LLVM_PROFILE_FILE=build/test_buffer.profraw ./build/tests/test_buffer
          LLVM_PROFILE_FILE=build/test_types.profraw ./build/tests/test_types
          LLVM_PROFILE_FILE=build/test_network.profraw ./build/tests/test_network
          LLVM_PROFILE_FILE=build/test_grpc_proxy.profraw ./build/tests/test_grpc_proxy
          LLVM_PROFILE_FILE=build/test_integration.profraw ./build/tests/test_integration
          LLVM_PROFILE_FILE=build/test_arena.profraw ./build/tests/test_arena
          LLVM_PROFILE_FILE=build/test_expected.profraw ./build/tests/test_expected
          LLVM_PROFILE_FILE=build/test_json.profraw ./build/tests/test_json
          LLVM_PROFILE_FILE=build/test_parse_integer.profraw ./build/tests/test_parse_integer
          LLVM_PROFILE_FILE=build/test_http_parser.profraw ./build/tests/test_http_parser
          LLVM_PROFILE_FILE=build/test_drain.profraw ./build/tests/test_drain
          LLVM_PROFILE_FILE=build/test_access_log.profraw ./build/tests/test_access_log
          LLVM_PROFILE_FILE=build/test_fault_injection.profraw ./build/tests/test_fault_injection
          LLVM_PROFILE_FILE=build/test_metrics.profraw ./build/tests/test_metrics
          LLVM_PROFILE_FILE=build/test_chunked_parser.profraw ./build/tests/test_chunked_parser
          LLVM_PROFILE_FILE=build/test_rir.profraw ./build/tests/test_rir
          LLVM_PROFILE_FILE=build/test_frontend.profraw ./build/tests/test_frontend
          LLVM_PROFILE_FILE=build/test_shard_control.profraw ./build/tests/test_shard_control
          LLVM_PROFILE_FILE=build/test_traffic_capture.profraw ./build/tests/test_traffic_capture
          LLVM_PROFILE_FILE=build/test_traffic_replay.profraw ./build/tests/test_traffic_replay
          LLVM_PROFILE_FILE=build/test_sim.profraw ./build/tests/test_sim
          LLVM_PROFILE_FILE=build/test_jit.profraw ./build/tests/test_jit
          LLVM_PROFILE_FILE=build/test_simulate_engine.profraw ./build/tests/test_simulate_engine
          LLVM_PROFILE_FILE=build/test_route_trie.profraw ./build/tests/test_route_trie
          LLVM_PROFILE_FILE=build/test_route_art.profraw ./build/tests/test_route_art
          LLVM_PROFILE_FILE=build/test_route_select.profraw ./build/tests/test_route_select
          LLVM_PROFILE_FILE=build/test_http2.profraw ./build/tests/test_http2
          LLVM_PROFILE_FILE=build/test_hpack.profraw ./build/tests/test_hpack
          LLVM_PROFILE_FILE=build/test_hpack_diff.profraw ./build/tests/test_hpack_diff
          LLVM_PROFILE_FILE=build/test_http2_conn.profraw ./build/tests/test_http2_conn
          LLVM_PROFILE_FILE=build/test_ws_frame.profraw ./build/tests/test_ws_frame
          LLVM_PROFILE_FILE=build/test_ws_terminate.profraw ./build/tests/test_ws_terminate
          LLVM_PROFILE_FILE=build/test_ws_upgrade_admission.profraw ./build/tests/test_ws_upgrade_admission
          LLVM_PROFILE_FILE=build/test_http_tokens.profraw ./build/tests/test_http_tokens
          LLVM_PROFILE_FILE=build/test_http_cache.profraw ./build/tests/test_http_cache
          LLVM_PROFILE_FILE=build/test_dns.profraw ./build/tests/test_dns
          LLVM_PROFILE_FILE=build/test_https_fetch.profraw ./build/tests/test_https_fetch
          LLVM_PROFILE_FILE=build/test_consumer_registry.profraw ./build/tests/test_consumer_registry
          LLVM_PROFILE_FILE=build/test_remote_jwks_metadata.profraw ./build/tests/test_remote_jwks_metadata
          LLVM_PROFILE_FILE=build/test_jwt_rs256.profraw ./build/tests/test_jwt_rs256
          LLVM_PROFILE_FILE=build/test_public_key.profraw ./build/tests/test_public_key
          LLVM_PROFILE_FILE=build/test_regex_capture.profraw ./build/tests/test_regex_capture
          LLVM_PROFILE_FILE=build/test_target_transform.profraw ./build/tests/test_target_transform
          LLVM_PROFILE_FILE=build/test_routing_properties.profraw ./build/tests/test_routing_properties

      - name: Generate coverage report
        run: |
          "$LLVM_PROFDATA" merge build/*.profraw -o build/merged.profdata

          # Report first-party coverage areas as the UNION across test binaries:
          # a line counts as covered if any binary hits it. `llvm-cov
          # report` alone picks one binary's instantiation per line for
          # inline/template functions in headers, which undercounts
          # coverage dramatically (e.g. handle_jit_outcome<Loop> has
          # different instantiations in test_network vs test_integration
          # — whichever comes first wins the reporting slot). The helper
          # walks per-binary JSON exports and max-merges per line. The
          # threshold still gates runtime coverage by default.
          #
          # io_uring_backend / epoll_backend are excluded: require
          # kernel features / permissions that are unreliable in CI.
          # They are tested via conditional integration tests.
          #
          # test_traffic_capture / test_traffic_replay / test_sim /
          # test_shard_control / test_ws_upgrade_admission are not passed as
          # --object because they instantiate callbacks_impl.h templates for
          # test-only loop types; the union merge would incorrectly count those as
          # real production paths. They still run above for correctness
          # validation.
          LLVM_COV="$LLVM_COV" python3 scripts/coverage_report.py \
            --profile build/merged.profdata \
            --threshold 95 \
            build/tests/test_buffer \
            build/tests/test_types \
            build/tests/test_network \
            build/tests/test_grpc_proxy \
            build/tests/test_integration \
            build/tests/test_arena \
            build/tests/test_http_parser \
            build/tests/test_http2 \
            build/tests/test_hpack \
            build/tests/test_hpack_diff \
            build/tests/test_http2_conn \
            build/tests/test_ws_frame \
            build/tests/test_ws_terminate \
            build/tests/test_http_tokens \
            build/tests/test_http_cache \
            build/tests/test_dns \
            build/tests/test_expected \
            build/tests/test_drain \
            build/tests/test_access_log \
            build/tests/test_fault_injection \
            build/tests/test_metrics \
            build/tests/test_chunked_parser \
            build/tests/test_rir \
            build/tests/test_json \
            build/tests/test_parse_integer \
            build/tests/test_frontend \
            build/tests/test_jit \
            build/tests/test_simulate_engine \
            build/tests/test_route_trie \
            build/tests/test_route_art \
            build/tests/test_route_select \
            build/tests/test_https_fetch \
            build/tests/test_consumer_registry \
            build/tests/test_remote_jwks_metadata \
            build/tests/test_jwt_rs256 \
            build/tests/test_public_key \
            build/tests/test_regex_capture \
            build/tests/test_target_transform \
            build/tests/test_routing_properties

  integer-parser:
    name: Integer parser (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.native == 'true' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'ci' || inputs.mode == 'integer-parser')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install compiler
        run: |
          if ! command -v clang++-20 >/dev/null || ! clang++-20 --version >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends clang-20
          fi
          clang++-20 --version
      - name: Check every integer parser candidate
        env:
          CXX: clang++-20
          RUT_RUN_BENCHMARKS: '0'
          RUT_REQUIRE_AVX512: ${{ matrix.arch == 'x86' && inputs.require_avx512 && '1' || '0' }}
        run: scripts/check_parse_integer_arch.sh build/integer-parser
      - name: Publish architecture summary
        if: always()
        run: |
          if [[ -f build/integer-parser/summary.md ]]; then
            cat build/integer-parser/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integer-parser-${{ matrix.arch }}
          path: |
            build/integer-parser/environment.txt
            build/integer-parser/summary.md
            build/integer-parser/test-*.log
          if-no-files-found: error
