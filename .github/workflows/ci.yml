name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: stacked PRs (base = another feature branch)
  # must run CI too. pull_request uses the HEAD branch's workflow file,
  # so this takes effect as soon as the branch carries this change.
  pull_request:
  workflow_dispatch:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install clang-format (LLVM snapshot, v20)
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble main" | \
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-format-20 || sudo apt-get install -y clang-format-19
          CF=$(command -v clang-format-20 || command -v clang-format-19)
          echo "CF=$CF" >> "$GITHUB_ENV"
          $CF --version

      - name: Check formatting
        run: |
          find include src testing tests bench -name '*.h' -o -name '*.cc' | \
            xargs $CF --dry-run --Werror

  lint:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-20 clang-tidy-20 llvm-20-dev cmake ninja-build libboost-dev ragel
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-20 100

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DLLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm

      - name: Lint
        run: |
          # Exclude all arch-specific SIMD backends — only lint scalar
          # and main parser code (arch-independent).
          find src -name '*.cc' \
            ! -path '*/simd/sse2.cc' \
            ! -path '*/simd/avx2.cc' \
            ! -path '*/simd/avx512.cc' \
            ! -path '*/simd/neon.cc' \
            ! -path '*/simd/sve.cc' | \
            xargs clang-tidy -p build --warnings-as-errors='bugprone-*,performance-*'

  runtime-state-model:
    name: Runtime state model
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download TLA+ tools
        run: |
          TLA2TOOLS_VERSION=v1.7.4
          TLA2TOOLS_SHA256=936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
          curl --fail --location --retry 3 \
            --output /tmp/tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA2TOOLS_VERSION}/tla2tools.jar"
          printf '%s  %s\n' "$TLA2TOOLS_SHA256" /tmp/tla2tools.jar | sha256sum --check

      - name: Check runtime state model
        run: TLA2TOOLS_JAR=/tmp/tla2tools.jar python3 scripts/check_runtime_state_model.py

  test:
    name: Build & Test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [clang, gcc]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install tools
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | \
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build llvm-21-dev libboost-dev ragel
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang-21
            sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-21 100
            sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-21 100
          fi

      - name: Configure
        run: |
          LLVM_OPT="-DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm"
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            CC=clang CXX=clang++ cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} $LLVM_OPT
          else
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} $LLVM_OPT
          fi

      - name: Build
        run: ninja -C build

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error -j 1 --timeout 180

  test-no-jit:
    name: Build & Test (no JIT)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-dev

      - name: Configure
        run: cmake -B build -G Ninja -DRUT_ENABLE_JIT=OFF -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: ninja -C build

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error -j 1 --timeout 180

  test-no-websocket:
    name: Build & Test (no WebSocket)
    runs-on: ubuntu-24.04
    # RUT_ENABLE_WEBSOCKET=0 is a shipped config (minimal mesh sidecars that never
    # proxy WebSocket). Build it so the #if RUT_ENABLE_WEBSOCKET runtime paths compile
    # out cleanly AND the parser rejects websocket() routes
    # (websocket_rejected_when_tunnel_disabled). JIT off — the gate test is frontend-only.
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-dev
      - name: Configure
        run: cmake -B build -G Ninja -DRUT_ENABLE_WEBSOCKET=OFF -DRUT_ENABLE_JIT=OFF -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: ninja -C build
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error -j 1 --timeout 180

  sanitizer:
    name: Sanitizer (ASan+UBSan)
    runs-on: ubuntu-24.04
    # ubuntu-24.04 has a 6.x kernel, so the real-io_uring integration tests
    # (proxy-over-TLS keep-alive, watermark backpressure, recv re-arm) actually
    # run here under AddressSanitizer — the detector for the io_uring async-cancel /
    # recv lifecycle bugs that are otherwise only reasoned about. JIT is off (its
    # generated code isn't instrumented).
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-dev
      - name: Configure
        run: cmake -B build -G Ninja -DRUT_ENABLE_JIT=OFF -DRUT_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: ninja -C build
      - name: Test
        # halt_on_error=1: fail the job on the first ASan/UBSan report.
        # detect_leaks=0: the per-shard mmap arenas are intentionally never freed.
        run: |
          ASAN_OPTIONS=halt_on_error=1:detect_leaks=0 \
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
          ctest --test-dir build --output-on-failure --no-tests=error -j 1 --timeout 300

  bench-proxy:
    name: Proxy keep-alive bench (TLS, io_uring)
    runs-on: ubuntu-24.04
    # Informational — proxy latency/throughput numbers go to the log so a change
    # off the per-byte path (e.g. cancel-by-fd) can be eyeballed against history.
    # Not a pass/fail perf gate (shared runners are too noisy); the bench itself
    # still asserts every request completes, so a hang/truncation regression fails.
    # Real io_uring (6.x kernel on ubuntu-24.04); Release for representative numbers.
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-dev
      - name: Configure
        run: cmake -B build -G Ninja -DRUT_ENABLE_JIT=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: ninja -C build test_integration
      - name: Bench
        # set -o pipefail so a failing test run (non-zero exit) isn't masked by grep's
        # exit status — otherwise the bench's "every request completes" assertion is
        # silently dropped whenever grep matches a line.
        run: |
          set -o pipefail
          RUT_BENCH=1 ./build/tests/test_integration --filter=proxy_tls_iouring.keepalive_latency_bench 2>&1 | grep -E '\[bench\]|keepalive_latency_bench'

  bench-simd-x86:
    name: SIMD scan_uri bench (x86)
    runs-on: ubuntu-24.04
    # Informational — perf numbers go to the log so reviewers can see
    # SIMD speedup across ISAs side-by-side. Doesn't fail on regression
    # (would need a stable baseline + tolerance; left to follow-up).
    #
    # Runner pool: GitHub-hosted ubuntu-24.04 runners are a mixed pool
    # of Intel Xeon (Ice Lake-class, AVX-512 capable) and AMD EPYC
    # 7763 / 9V74 (Zen 3/4, AVX-512 absent or masked off in the VM
    # SKU). The bench step runtime-checks /proc/cpuinfo flags and
    # skips ISAs the runner can't execute, so the avx512 column may
    # be absent depending on which CPU was scheduled. We tried
    # ubuntu-22.04 to bias toward Intel; that pool turned out to
    # share the same AMD-heavy distribution AND its 5.15 kernel
    # headers don't have the io_uring features rut_runtime depends
    # on, so we stayed on 24.04.
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-20 cmake ninja-build llvm-20-dev libboost-dev ragel
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 100

      - name: Report CPU capabilities
        run: |
          grep -m1 '^model name' /proc/cpuinfo
          # Use only the first 'flags' line (one CPU's-worth) and
          # extract every avx*/sse* token from it. -m1 alone on the
          # outer grep would only print the first matched flag.
          grep -m1 '^flags' /proc/cpuinfo | grep -oE '(avx[0-9a-z_]*|sse[0-9_]*)' | sort -u | tr '\n' ' '
          echo

      - name: Bench across x86 SIMD ISAs
        run: |
          mkdir -p /tmp/bench-results /tmp/dispatch-results
          # GitHub-hosted x86 runners' CPUs vary (Intel Xeon / AMD EPYC).
          # Skip ISAs the CPU can't execute. Per-arch isolation keeps a
          # single failure from aborting the whole job.
          for arch in scalar sse2 avx2 avx512; do
            case $arch in
              sse2)    needs="sse2" ;;
              avx2)    needs="avx2" ;;
              # avx512: gate on AVX512BW (byte/word ops), not just F.
              # avx512.cc uses _mm512_cmpeq_epi8_mask / cmplt_epu8_mask /
              # movepi8_mask, all of which require BW. Knights Landing /
              # Mill expose F+ER+CD+PF but not BW; SkyLake-X and onward
              # have BW. Gating on F alone would let a KNL runner build
              # with -mavx512bw and SIGILL at runtime.
              avx512)  needs="avx512bw" ;;
              scalar)  needs="" ;;
            esac
            if [ -n "$needs" ] && ! grep -qE "^flags.*\b$needs\b" /proc/cpuinfo; then
              echo "::notice::CPU lacks $needs — skipping SIMD_ARCH=$arch"
              continue
            fi
            echo "=== building SIMD_ARCH=$arch ==="
            rm -rf "build-$arch"
            if ! CC=clang CXX=clang++ cmake -B "build-$arch" -G Ninja \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DSIMD_ARCH=$arch \
                  -DLLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm > /dev/null 2> "/tmp/cmake-$arch.err"; then
              echo "::warning::cmake configure failed for SIMD_ARCH=$arch"
              cat "/tmp/cmake-$arch.err"
              continue
            fi
            if ! ninja -C "build-$arch" bench_scan_uri 2> "/tmp/build-$arch.err"; then
              echo "::warning::build failed for SIMD_ARCH=$arch"
              tail -30 "/tmp/build-$arch.err"
              continue
            fi
            ./build-$arch/bench/bench_scan_uri 2> "/tmp/run-$arch.err" | tee "/tmp/bench-results/$arch.txt" || \
              { echo "::warning::scan_uri run failed for SIMD_ARCH=$arch"; cat "/tmp/run-$arch.err"; }
            echo
          done

      - name: Unified comparison report
        run: |
          echo "==============================================================="
          echo "scan_uri SIMD vs scalar — same hardware, different ISA backends"
          echo "==============================================================="
          for arch in scalar sse2 avx2 avx512; do
            f="/tmp/bench-results/$arch.txt"
            if [ ! -f "$f" ]; then
              echo
              echo "--- $arch (skipped: CPU lacks support) ---"
              continue
            fi
            echo
            echo "--- $arch ---"
            cat "$f"
          done

          echo
          echo "==============================================================="
          echo "dispatch comparison — linear scan vs scalar ART vs JIT ART"
          echo "==============================================================="
          for arch in scalar sse2 avx2 avx512; do
            f="/tmp/dispatch-results/$arch.txt"
            if [ ! -f "$f" ]; then
              echo
              echo "--- $arch (skipped: CPU lacks support) ---"
              continue
            fi
            echo
            echo "--- $arch ---"
            cat "$f"
          done

  bench-simd-arm:
    name: SIMD scan_uri bench (arm64)
    runs-on: ubuntu-24.04-arm
    # GitHub-hosted ubuntu-24.04-arm runners are Cobalt 100 (Neoverse N2)
    # with NEON. SVE may or may not be exposed depending on the runner
    # configuration; the bench job below tolerates either case.
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-20 cmake ninja-build llvm-20-dev libboost-dev ragel
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 100

      - name: Report CPU capabilities
        run: |
          grep -m1 '^Features' /proc/cpuinfo || true
          grep -m1 '^CPU implementer' /proc/cpuinfo || true
          grep -m1 '^CPU part' /proc/cpuinfo || true

      - name: Bench across arm64 SIMD ISAs
        run: |
          mkdir -p /tmp/bench-results /tmp/dispatch-results
          # neon is universal on aarch64; sve only if the runner exposes it.
          ARCHES="scalar neon"
          if grep -q -m1 'sve' /proc/cpuinfo; then
            ARCHES="$ARCHES sve"
          else
            echo "::notice::SVE not available on this runner — skipping sve build"
          fi
          # Each arch attempt is isolated — if one fails (e.g. compiler
          # quirk on SVE), the others still run and the job stays green.
          for arch in $ARCHES; do
            echo "=== building SIMD_ARCH=$arch ==="
            rm -rf "build-$arch"
            if ! CC=clang CXX=clang++ cmake -B "build-$arch" -G Ninja \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DSIMD_ARCH=$arch \
                  -DLLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm > /dev/null 2> "/tmp/cmake-$arch.err"; then
              echo "::warning::cmake configure failed for SIMD_ARCH=$arch"
              cat "/tmp/cmake-$arch.err"
              continue
            fi
            if ! ninja -C "build-$arch" bench_scan_uri 2> "/tmp/build-$arch.err"; then
              echo "::warning::build failed for SIMD_ARCH=$arch"
              tail -30 "/tmp/build-$arch.err"
              continue
            fi
            ./build-$arch/bench/bench_scan_uri 2> "/tmp/run-$arch.err" | tee "/tmp/bench-results/$arch.txt" || \
              { echo "::warning::scan_uri run failed for SIMD_ARCH=$arch"; cat "/tmp/run-$arch.err"; }
            if ! ninja -C "build-$arch" bench_dispatch_compare 2> "/tmp/dispatch-build-$arch.err"; then
              echo "::warning::dispatch_compare build failed for SIMD_ARCH=$arch"
              tail -30 "/tmp/dispatch-build-$arch.err"
              continue
            fi
            ./build-$arch/bench/bench_dispatch_compare 2> "/tmp/dispatch-$arch.err" | tee "/tmp/dispatch-results/$arch.txt" || \
              { echo "::warning::dispatch_compare run failed for SIMD_ARCH=$arch"; cat "/tmp/dispatch-$arch.err"; }
            echo
          done

      - name: Unified comparison report
        run: |
          echo "==============================================================="
          echo "scan_uri SIMD vs scalar — arm64 backends on same hardware"
          echo "==============================================================="
          # Enable nullglob so an empty result set yields zero loop
          # iterations rather than the literal pattern (which would
          # fail under `bash -e`). If every per-arch attempt failed,
          # we just print a notice and exit clean — the per-arch
          # ::warning::s above already document what went wrong.
          shopt -s nullglob
          results=(/tmp/bench-results/*.txt)
          if [ ${#results[@]} -eq 0 ]; then
            echo "::notice::no per-arch scan_uri results captured — see warnings above"
          else
            for f in "${results[@]}"; do
              arch=$(basename "$f" .txt)
              echo
              echo "--- $arch ---"
              cat "$f"
            done
          fi

          echo
          echo "==============================================================="
          echo "dispatch comparison — linear scan vs scalar ART vs JIT ART (arm64)"
          echo "==============================================================="
          shopt -s nullglob
          dispatch_results=(/tmp/dispatch-results/*.txt)
          if [ ${#dispatch_results[@]} -eq 0 ]; then
            echo "::notice::no dispatch_compare results captured — see warnings above"
          else
            for f in "${dispatch_results[@]}"; do
              arch=$(basename "$f" .txt)
              echo
              echo "--- $arch ---"
              cat "$f"
            done
          fi

  coverage:
    name: Code Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install tools
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | \
            sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-21 llvm-21 llvm-21-dev cmake ninja-build libboost-dev ragel
          echo "CC=/usr/bin/clang-21" >> "$GITHUB_ENV"
          echo "CXX=/usr/bin/clang++-21" >> "$GITHUB_ENV"
          echo "LLVM_PROFDATA=/usr/bin/llvm-profdata-21" >> "$GITHUB_ENV"
          echo "LLVM_COV=/usr/bin/llvm-cov-21" >> "$GITHUB_ENV"

      - name: Test coverage report helper
        run: python3 tests/test_coverage_report.py

      - name: Collect pull request changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > /tmp/coverage-changed-files.txt

      - name: Build with coverage
        run: |
          CC="$CC" CXX="$CXX" cmake -B build -G Ninja \
            -DCMAKE_CXX_FLAGS="-fprofile-instr-generate -fcoverage-mapping" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm
          ninja -C build

      - name: Run tests
        run: |
          LLVM_PROFILE_FILE=build/test_buffer.profraw ./build/tests/test_buffer
          LLVM_PROFILE_FILE=build/test_types.profraw ./build/tests/test_types
          LLVM_PROFILE_FILE=build/test_network.profraw ./build/tests/test_network
          LLVM_PROFILE_FILE=build/test_integration.profraw ./build/tests/test_integration
          LLVM_PROFILE_FILE=build/test_arena.profraw ./build/tests/test_arena
          LLVM_PROFILE_FILE=build/test_expected.profraw ./build/tests/test_expected
          LLVM_PROFILE_FILE=build/test_http_parser.profraw ./build/tests/test_http_parser
          LLVM_PROFILE_FILE=build/test_drain.profraw ./build/tests/test_drain
          LLVM_PROFILE_FILE=build/test_access_log.profraw ./build/tests/test_access_log
          LLVM_PROFILE_FILE=build/test_fault_injection.profraw ./build/tests/test_fault_injection
          LLVM_PROFILE_FILE=build/test_metrics.profraw ./build/tests/test_metrics
          LLVM_PROFILE_FILE=build/test_chunked_parser.profraw ./build/tests/test_chunked_parser
          LLVM_PROFILE_FILE=build/test_rir.profraw ./build/tests/test_rir
          LLVM_PROFILE_FILE=build/test_frontend.profraw ./build/tests/test_frontend
          LLVM_PROFILE_FILE=build/test_control_plane_mutation.profraw ./build/tests/test_control_plane_mutation
          LLVM_PROFILE_FILE=build/test_reload_coordinator.profraw ./build/tests/test_reload_coordinator
          LLVM_PROFILE_FILE=build/test_serve_loader.profraw ./build/tests/test_serve_loader
          LLVM_PROFILE_FILE=build/test_shard_control.profraw ./build/tests/test_shard_control
          LLVM_PROFILE_FILE=build/test_traffic_capture.profraw ./build/tests/test_traffic_capture
          LLVM_PROFILE_FILE=build/test_traffic_replay.profraw ./build/tests/test_traffic_replay
          LLVM_PROFILE_FILE=build/test_sim.profraw ./build/tests/test_sim
          LLVM_PROFILE_FILE=build/test_jit.profraw ./build/tests/test_jit
          LLVM_PROFILE_FILE=build/test_simulate_engine.profraw ./build/tests/test_simulate_engine
          LLVM_PROFILE_FILE=build/test_route_trie.profraw ./build/tests/test_route_trie
          LLVM_PROFILE_FILE=build/test_route_art.profraw ./build/tests/test_route_art
          LLVM_PROFILE_FILE=build/test_route_select.profraw ./build/tests/test_route_select
          LLVM_PROFILE_FILE=build/test_http2.profraw ./build/tests/test_http2
          LLVM_PROFILE_FILE=build/test_hpack.profraw ./build/tests/test_hpack
          LLVM_PROFILE_FILE=build/test_hpack_diff.profraw ./build/tests/test_hpack_diff
          LLVM_PROFILE_FILE=build/test_http2_conn.profraw ./build/tests/test_http2_conn
          LLVM_PROFILE_FILE=build/test_ws_frame.profraw ./build/tests/test_ws_frame
          LLVM_PROFILE_FILE=build/test_ws_terminate.profraw ./build/tests/test_ws_terminate

      - name: Generate coverage report
        run: |
          "$LLVM_PROFDATA" merge build/*.profraw -o build/merged.profdata

          changed_args=()
          if [[ -s /tmp/coverage-changed-files.txt ]]; then
            changed_args+=(--changed-files-from /tmp/coverage-changed-files.txt)
          fi

          # Report first-party coverage areas as the UNION across test binaries:
          # a line counts as covered if any binary hits it. `llvm-cov
          # report` alone picks one binary's instantiation per line for
          # inline/template functions in headers, which undercounts
          # coverage dramatically (e.g. handle_jit_outcome<Loop> has
          # different instantiations in test_network vs test_integration
          # — whichever comes first wins the reporting slot). The helper
          # walks per-binary JSON exports and max-merges per line. The
          # threshold still gates runtime coverage by default.
          #
          # Host-dependent backend/event-loop files remain visible in the
          # report but are excluded from the percentage gate. llvm-cov exports
          # only the linked SIMD implementation, so the active backend stays in
          # this gate; the separate SIMD jobs build the other implementations.
          #
          # test_traffic_capture / test_traffic_replay / test_sim /
          # test_shard_control are not passed as --object because they
          # instantiate callbacks_impl.h templates for test-only loop
          # types; the union merge would incorrectly count those as
          # real production paths. They still run above for correctness
          # validation.
          set +e
          LLVM_COV="$LLVM_COV" python3 scripts/coverage_report.py \
            --profile build/merged.profdata \
            --threshold 97 \
            "${changed_args[@]}" \
            build/tests/test_buffer \
            build/tests/test_types \
            build/tests/test_network \
            build/tests/test_integration \
            build/tests/test_arena \
            build/tests/test_http_parser \
            build/tests/test_http2 \
            build/tests/test_hpack \
