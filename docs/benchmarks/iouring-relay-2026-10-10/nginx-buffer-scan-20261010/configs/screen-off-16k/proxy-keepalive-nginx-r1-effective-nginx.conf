worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 8192; }
http { access_log off;
upstream benchmark_origin { server 127.0.0.1:8704; keepalive 4096; keepalive_timeout 60s; keepalive_requests 1000000000; }
server { listen 127.0.0.1:8604; keepalive_requests 1000000000; location = /proxy { proxy_pass http://benchmark_origin; proxy_http_version 1.1; proxy_buffering off; proxy_buffer_size 16k; proxy_buffers 8 16k; proxy_busy_buffers_size 16k; proxy_max_temp_file_size 0; proxy_set_header Host $http_host; proxy_set_header Connection ""; } }
}
