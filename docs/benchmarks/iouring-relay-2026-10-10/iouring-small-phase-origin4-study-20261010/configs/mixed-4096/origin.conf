worker_processes 4;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 8192; multi_accept on; }
http { access_log off;
map $http_x_rut_benchmark_preflight $benchmark_preflight { default 0; ~.+ 1; }
log_format rut_preflight "marker=$http_x_rut_benchmark_preflight connection=$connection requests=$connection_requests";
map $http_x_payload $payload_file { default /benchmark-payloads/proxy; small /benchmark-payloads/small; }
server { listen 127.0.0.1:8706; keepalive_timeout 60; keepalive_requests 1000000000; access_log /dev/stdout rut_preflight if=$benchmark_preflight; location = /proxy { alias $payload_file; default_type application/octet-stream; etag off; max_ranges 0; } location / { root /benchmark-payloads; default_type application/octet-stream; etag off; max_ranges 0; add_header Last-Modified ""; } }
}
