syntax = "proto3";
package example;
message Message {
  string text = 1;
  int64 id = 2;
}
message Envelope {
  Message child = 1;
  string label = 2;
}
message Batch {
  repeated int32 values = 1;
  repeated string names = 2;
}
message MessageBatch { repeated Message entries = 1; }

service BatchEcho { rpc Unary(MessageBatch) returns (MessageBatch); }
