syntax = "proto3";
package example;
message CodecMessage {
  string text = 1;
  bool enabled = 2;
  int32 count = 3;
  int64 id = 4;
  sint32 delta = 5;
  sint64 distance = 6;
  uint32 size = 7;
  bytes data = 8;
}
message FixedMessage {
  sfixed32 a = 1;
  sfixed64 b = 2;
  fixed32 c = 3;
}

message HighTag { string text = 536870911; }
message NestedChild {
  string text = 1;
  int32 id = 2;
}
message NestedMessage {
  NestedChild child = 1;
  string label = 2;
}
message RecursiveMessage {
  RecursiveMessage child = 1;
}
message RepeatedMessage {
  repeated int32 values = 1;
}
message SharedMessage {
  NestedChild first = 1;
  NestedChild second = 2;
}
message RepeatedScalars {
  repeated int32 values = 1 [packed = false];
  repeated string names = 2;
  repeated bool flags = 3;
  repeated sint64 numbers = 4 [packed = true];
}
message RepeatedChild {
  repeated NestedChild children = 1;
}
message CollectionLeaf {
  repeated sint32 values = 1;
  NestedChild child = 2;
  bool enabled = 3;
  sint64 distance = 4;
}
message CollectionBranch { repeated CollectionLeaf leaves = 1; }
message CollectionTree { repeated CollectionBranch branches = 1; }
message BytesNested {
  bytes text = 1;
  int32 id = 2;
}
message BytesChild { repeated BytesNested children = 1; }
message StringRetaggedNested {
  string text = 7;
  sint32 id = 8;
}
message StringRetaggedChild { repeated StringRetaggedNested children = 9; }
message IncompatibleNested {
  string text = 7;
  string extra = 8;
}
message IncompatibleChild { repeated IncompatibleNested children = 9; }

service UnaryCodec {
  rpc Echo(RepeatedChild) returns (RepeatedChild);
  rpc Convert(BytesChild) returns (StringRetaggedChild);
  rpc BadShape(RepeatedChild) returns (IncompatibleChild);
  rpc Distinct(NestedChild) returns (RepeatedChild);
  rpc ClientStream(stream NestedChild) returns (NestedChild);
  rpc ServerStream(NestedChild) returns (stream NestedChild);
  rpc Bidi(stream NestedChild) returns (stream NestedChild);
}
