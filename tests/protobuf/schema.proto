syntax = "proto3";
package test.gateway;
import "types.proto";
message Request {
  message Child { Request parent = 1; }
  string display_name = 1;
  double ratio = 2;
  float weight = 3;
  int64 signed_value = 4;
  uint64 unsigned_value = 5;
  int32 count = 6;
  fixed64 token = 7;
  fixed32 bits = 8;
  bool enabled = 9;
  bytes body = 10;
  uint32 size = 11;
  sfixed32 offset = 12;
  sfixed64 position = 13;
  sint32 delta = 14;
  sint64 distance = 15;
  Child child = 16;
  test.shared.Payload payload = 17;
  repeated sint64 samples = 18;
  repeated int32 unpacked = 19 [packed = false];
  repeated string labels = 20;
  string alias = 21 [json_name = "customAlias"];
}
service Gateway {
  rpc Unary(Request) returns (test.shared.Payload);
  rpc ServerStream(Request) returns (stream test.shared.Payload);
  rpc ClientStream(stream Request) returns (test.shared.Payload);
  rpc Chat(stream Request) returns (stream test.shared.Payload);
}
