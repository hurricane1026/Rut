syntax = "proto3";
option java_package = "org.example." "grpc";
option java_outer_classname = "ExampleSchema";
option java_multiple_files = true;
option java_generate_equals_and_hash = false;
option java_string_check_utf8 = true;
option optimize_for = CODE_SIZE;
option go_package = "example.org/grpc;example";
option cc_generic_services = false;
option java_generic_services = false;
option py_generic_services = false;
option deprecated = true;
option cc_enable_arenas = true;
option objc_class_prefix = "EX";
option csharp_namespace = "Example.Grpc";
option swift_prefix = "EX";
option php_class_prefix = "EX";
option php_namespace = "Example\\Grpc";
option php_metadata_namespace = "Example\\Meta";
option ruby_package = "Example::Grpc";
import public "strings.proto";
